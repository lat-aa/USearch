apiVersion: v1
kind: Namespace
metadata:
  name: usearch
---
# Ubuntu glibc api via hostPath (.local/api + .local/lib). listen 0.0.0.0:8088.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: usearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ubuntu:26.04
          imagePullPolicy: IfNotPresent
          # ulimit -c 0: do not write core.* into hostPath workingDir (/app = repo root)
          command: ["/bin/bash", "-lc", "ulimit -c 0; exec /opt/usearch/api serve"]
          workingDir: /app
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: HOME
              value: /app
            - name: LD_LIBRARY_PATH
              value: /opt/usearch/lib
          volumeMounts:
            - name: repo
              mountPath: /app
            - name: bin
              mountPath: /opt/usearch
              readOnly: true
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
          resources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 12Gi
              cpu: "4"
      volumes:
        - name: repo
          hostPath:
            path: /mnt/e/data/USearch
            type: Directory
        - name: bin
          hostPath:
            path: /mnt/e/data/USearch/.local
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: usearch
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 8088
      targetPort: http
      nodePort: 30088
---
# Host api.ya.com via Traefik :80. Covers /v1 and /mcp.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: usearch
spec:
  ingressClassName: traefik
  rules:
    - host: api.ya.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8088

apiVersion: v1
kind: Namespace
metadata:
  name: usearch
---
# Ubuntu glibc api via hostPath (.local/api + .local/lib). listen 0.0.0.0:8088.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: usearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ubuntu:26.04
          imagePullPolicy: IfNotPresent
          # ulimit -c 0: do not write core.* into hostPath workingDir (/app = repo root)
          command: ["/bin/bash", "-lc", "ulimit -c 0; exec /opt/usearch/api serve"]
          workingDir: /app
          # WSL GPU：cgroup v2 设备规则默认拦截 /dev/dxg，须放行（内网单节点用 privileged）
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: HOME
              value: /app
            - name: LD_LIBRARY_PATH
              value: /opt/usearch/lib:/usr/local/cuda/lib64:/usr/lib/wsl/lib
            # 最小镜像无 /usr/lib/ssl：显式指向挂载的 CA，否则上游 HTTPS 校验失败
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            # 上游密钥统一口径：OPENAI_API_KEY（见 .config/config.toml [upstream] key_env）。
            # 用可选 Secret 引用：secret 不存在时 Pod 仍能启动，delegate 时才报缺 key。
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upstream-key
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: repo
              mountPath: /app
            - name: bin
              mountPath: /opt/usearch
              readOnly: true
            # GGUF 放到 Linux 盘 /var/lib/usearch/models，避免 9p/drvfs 随机读慢
            - name: models
              mountPath: /app/.config/models
              readOnly: true
            # 最小镜像无 CA：挂宿主证书库，否则 delegate 上游 HTTPS 校验失败
            - name: cacerts
              mountPath: /etc/ssl/certs
              readOnly: true
            # GPU（WSL DDA/GPU-PV）：设备节点 + 驱动库 + CUDA runtime
            - name: dxg
              mountPath: /dev/dxg
            - name: wslgpu
              mountPath: /usr/lib/wsl
              readOnly: true
            - name: cuda
              mountPath: /usr/local/cuda
              readOnly: true
          # 2.44GB GGUF 启动慢：先跑 startupProbe（最长 300s），过了才走就绪/存活
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 12Gi
              cpu: "4"
      volumes:
        - name: repo
          hostPath:
            path: /mnt/e/data/USearch
            type: Directory
        - name: bin
          hostPath:
            path: /mnt/e/data/USearch/.local
            type: Directory
        - name: models
          hostPath:
            path: /var/lib/usearch/models
            type: Directory
        - name: cacerts
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: dxg
          hostPath:
            path: /dev/dxg
            type: CharDevice
        - name: wslgpu
          hostPath:
            path: /usr/lib/wsl
            type: Directory
        - name: cuda
          hostPath:
            path: /usr/local/cuda-13.3
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: usearch
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 8088
      targetPort: http
      nodePort: 30088
---
# Host api.ya.com via Traefik :80. Covers /v1 and /mcp.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: usearch
spec:
  ingressClassName: traefik
  rules:
    - host: api.ya.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8088

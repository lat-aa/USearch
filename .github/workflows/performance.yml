# 周跑 / 手动 / 可被 quality 复用：test_perf 对照 baseline + 历史趋势。
name: performance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D USEARCH_BUILD_BENCH_CPP=ON \
            -D USEARCH_BUILD_TEST_CPP=ON \
            -D USEARCH_BUILD_FUZZ=OFF \
            -D USEARCH_USE_NUMKONG=OFF \
            -D USEARCH_BUILD_API=OFF
      - name: Build
        run: cmake --build build --target test_perf test_batch bench_cpp -j $(nproc)
      - name: Batch smoke
        run: ./build/test_batch
      - name: Perf vs baseline and trend
        run: |
          set -euo pipefail
          ./build/test_perf | tee /tmp/perf.json
          python3 scripts/perfcheck.py \
            --perf /tmp/perf.json \
            --baseline cpp/baseline.json \
            --hist cpp/perfhist.jsonl \
            --svg /tmp/perftrend.svg \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --append \
            --relative
          cat /tmp/perftrend.svg >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: |
            /tmp/perf.json
            /tmp/perftrend.svg
            cpp/perfhist.jsonl

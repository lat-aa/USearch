# 周跑 / 手动：test_perf QPS 对照 cpp/baseline.json 下限。
name: performance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D USEARCH_BUILD_BENCH_CPP=ON \
            -D USEARCH_BUILD_TEST_CPP=ON \
            -D USEARCH_BUILD_FUZZ=OFF \
            -D USEARCH_USE_NUMKONG=OFF \
            -D USEARCH_BUILD_API=OFF
      - name: Build
        run: cmake --build build --target test_perf test_batch bench_cpp -j $(nproc)
      - name: Batch smoke
        run: ./build/test_batch
      - name: Perf vs baseline
        run: |
          set -euo pipefail
          ./build/test_perf | tee /tmp/perf.json
          python3 - <<'PY'
          import json, sys
          lines = open("/tmp/perf.json").read().strip().splitlines()
          got = json.loads(lines[-1])
          base = json.load(open("cpp/baseline.json"))
          tol = float(base.get("tolerance", 0.15))
          floors = base["metrics"]
          mapping = {
              "add_qps": "add_qps_min",
              "search_qps": "search_qps_min",
              "batch_qps": "batch_qps_min",
          }
          failed = []
          for gk, fk in mapping.items():
              need = floors[fk] * (1.0 - tol)
              val = float(got[gk])
              print(f"{gk}={val:.1f} floor={need:.1f} (min={floors[fk]} tol={tol})")
              if val < need:
                  failed.append(gk)
          if failed:
              print("FAIL below floor:", ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("perf vs baseline ok")
          PY

name: Pre-Release

on:
  push:
    branches: ["main-dev"]
  pull_request:
    branches: ["main-dev"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality matrix
    uses: ./.github/workflows/quality.yml

  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3.0.0
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            conanfile.py:version = "(\d+\.\d+\.\d+)"
            README.md:version = {(\d+\.\d+\.\d+)}
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+)
          update-major-version-in: |
            include/usearch/index.hpp:^#define USEARCH_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/usearch/index.hpp:^#define USEARCH_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/usearch/index.hpp:^#define USEARCH_VERSION_PATCH (\d+)
          dry-run: "true"

  test_ubuntu_gcc:
    name: Ubuntu (GCC)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libjemalloc-dev libomp-dev
          cmake -B build_artifacts \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=1 \
            -D USEARCH_USE_OPENMP=1 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_USE_JEMALLOC=0 \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++ (ctest)
        run: ctest --test-dir build_artifacts --output-on-failure -L unit --timeout 600

  test_ubuntu_clang:
    name: Ubuntu (Clang)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang libomp-dev
          cmake -B build_artifacts \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=1 \
            -D USEARCH_USE_OPENMP=1 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++ (ctest)
        run: ctest --test-dir build_artifacts --output-on-failure -L unit --timeout 600

  test_asan:
    name: Ubuntu (ASan+UBSan)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build with sanitizers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang libomp-dev
          cmake -B build_asan \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_ENABLE_ASAN=ON \
            -D USEARCH_ENABLE_UBSAN=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_asan --config RelWithDebInfo -j$(nproc)
      - name: ctest under ASan
        run: ctest --test-dir build_asan --output-on-failure -L unit --timeout 900

  test_tsan:
    name: Ubuntu (TSan)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build with TSan
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang libomp-dev
          cmake -B build_tsan \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_USE_OPENMP=0 \
            -D USEARCH_ENABLE_TSAN=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_tsan --config RelWithDebInfo -j$(nproc)
      - name: ctest under TSan
        run: ctest --test-dir build_tsan --output-on-failure -L unit --timeout 1200

  test_fuzz:
    name: Ubuntu (libFuzzer)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build fuzz_index
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
          cmake -B build_fuzz \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_BUILD_FUZZ=ON \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_SANITIZE_DEBUG=OFF \
            -D USEARCH_ENABLE_ASAN=OFF \
            -D USEARCH_ENABLE_UBSAN=OFF
          cmake --build build_fuzz --target fuzz_index -j$(nproc)
      - name: Fuzz smoke (60s)
        run: build_fuzz/fuzz_index -max_total_time=60 -timeout=10 -rss_limit_mb=2048

  test_static:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck cmake clang
      - name: cppcheck
        run: |
          # warning-only：performance/portability 对 header-only 模板噪声过大。
          cppcheck --enable=warning --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unusedFunction \
            --suppress=throwInNoexceptFunction --suppress=returnDanglingLifetime \
            --suppress=duplInheritedMember --suppress=toomanyconfigs \
            --suppress=signConversionCond --suppress=uselessAssignmentPtrArg \
            --suppress=nullPointerRedundantCheck --suppress=pointerSize \
            --suppress=unmatchedSuppression \
            -I include -I stringzilla/include \
            include/usearch/index.hpp \
            include/usearch/index_dense.hpp \
            include/usearch/index_plugins.hpp \
            cpp/fuzz_index.cpp
      - name: Configure compile_commands
        run: |
          cmake -B build_tidy \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D CMAKE_CXX_COMPILER=clang++ \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_FUZZ=ON \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_SANITIZE_DEBUG=OFF
      - name: clang-tidy (CI hard gate)
        run: |
          clang-tidy -p build_tidy \
            --config-file=.clang-tidy.ci \
            cpp/fuzz_index.cpp \
            --warnings-as-errors='*' \
            --header-filter='^$' \
            -extra-arg=-Wno-unknown-warning-option

  test_coverage:
    name: Coverage (GCC)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build with coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov
          cmake -B build_cov \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_ENABLE_COVERAGE=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_cov -j$(nproc)
      - name: Run tests
        run: ctest --test-dir build_cov --output-on-failure -L unit --timeout 1800
      - name: lcov report
        run: |
          chmod +x scripts/check_coverage.sh
          lcov --capture --directory build_cov --output-file coverage.info --ignore-errors mismatch,gcov || \
            lcov --capture --directory build_cov --output-file coverage.info
          lcov --extract coverage.info '*/include/usearch/*' --output-file coverage_usearch.info || \
            cp coverage.info coverage_usearch.info
          lcov --list coverage_usearch.info | tee coverage.txt
          MIN_LINE_PCT=40 ./scripts/check_coverage.sh coverage_usearch.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            coverage.info
            coverage_usearch.info
            coverage.txt

  test_linux_arm:
    name: Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          cmake -B build_artifacts \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_artifacts --config RelWithDebInfo -j"$(nproc)"
      - name: Test C++ (ctest)
        run: ctest --test-dir build_artifacts --output-on-failure -L unit --timeout 600

  test_windows_asan:
    name: Windows (MSVC ASan)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Locate MSVC ASan runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dll = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dll) { throw "MSVC ASan DLL not found under $vs\VC\Tools\MSVC" }
          Write-Host "ASan DLL: $($dll.FullName)"
          Set-Content -Path "$env:GITHUB_WORKSPACE/asan_dll_dir.txt" -Value $dll.DirectoryName -NoNewline
          Add-Content -Path $env:GITHUB_PATH -Value $dll.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value "ASAN_DLL_DIR=$($dll.DirectoryName)"
      - name: Build with ASan
        run: |
          cmake -B build_asan `
            -D CMAKE_BUILD_TYPE=RelWithDebInfo `
            -D USEARCH_BUILD_TEST_CPP=1 `
            -D USEARCH_BUILD_BENCH_CPP=0 `
            -D USEARCH_USE_NUMKONG=0 `
            -D USEARCH_ENABLE_ASAN=ON `
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_asan --config RelWithDebInfo
      - name: Stage ASan DLL beside test binaries
        shell: pwsh
        run: |
          $dllDir = if ($env:ASAN_DLL_DIR) { $env:ASAN_DLL_DIR } else { Get-Content -Raw "$env:GITHUB_WORKSPACE/asan_dll_dir.txt" }
          if (-not (Test-Path "$dllDir\clang_rt.asan_dynamic-x86_64.dll")) { throw "missing $dllDir\clang_rt.asan_dynamic-x86_64.dll" }
          Get-ChildItem build_asan -Recurse -Filter "*.exe" | ForEach-Object {
            Copy-Item "$dllDir\clang_rt.asan_dynamic-x86_64.dll" $_.DirectoryName -Force
          }
      - name: Test
        run: ctest --test-dir build_asan --output-on-failure -C RelWithDebInfo -L unit --timeout 900
        env:
          ASAN_OPTIONS: halt_on_error=1

  test_macos:
    name: macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C++
        run: |
          brew update
          brew reinstall cmake
          cmake -B build_artifacts \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=1 \
            -D USEARCH_USE_NUMKONG=1 \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++ (ctest)
        run: ctest --test-dir build_artifacts --output-on-failure -L unit --timeout 600

  test_windows_x86:
    name: Windows (X86)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build C++
        run: |
          cmake -B build_artifacts `
            -D CMAKE_BUILD_TYPE=RelWithDebInfo `
            -D USEARCH_BUILD_TEST_CPP=1 `
            -D USEARCH_BUILD_BENCH_CPP=1 `
            -D USEARCH_USE_NUMKONG=1 `
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++ (ctest)
        run: ctest --test-dir build_artifacts --output-on-failure -C RelWithDebInfo -L unit --timeout 600

  # API smoke pulls llama.cpp — functional gate (sanitizers covered by unit jobs).
  test_api_smoke:
    name: API smoke
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
      - name: Build api
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libomp-dev python3 curl
          cmake -B build_api \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=0 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_BUILD_API=ON \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build_api --target api -j$(nproc)
      - name: Smoke HTTP/MCP
        run: |
          chmod +x scripts/smoke_api.sh
          API_BIN="$PWD/build_api/api" ./scripts/smoke_api.sh

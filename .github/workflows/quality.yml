name: Quality matrix

# Reusable quality gate — called from Pre-Release and Release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit_asan:
    name: ASan+UBSan+correctness
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libomp-dev
          cmake -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_ENABLE_ASAN=ON \
            -D USEARCH_ENABLE_UBSAN=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build -j"$(nproc)"
      - name: ctest
        run: ctest --test-dir build --output-on-failure -L unit --timeout 900

  unit_tsan:
    name: TSan
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
          cmake -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_USE_NUMKONG=0 \
            -D USEARCH_ENABLE_TSAN=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build -j"$(nproc)"
      - name: ctest
        run: ctest --test-dir build --output-on-failure -L unit --timeout 1200

  # NumKong integration gate (GCC). Clang+ASan+NumKong stays OFF (historical fragility).
  unit_numkong:
    name: GCC NumKong
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libomp-dev
          cmake -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=1 \
            -D USEARCH_USE_OPENMP=1 \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build -j"$(nproc)"
      - name: ctest
        run: ctest --test-dir build --output-on-failure -L "unit|numkong" --timeout 900

  # L3: GCC ASan+NumKong — prefer GCC over Clang for NumKong sanitizer matrix.
  unit_numkong_asan:
    name: GCC ASan NumKong
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libomp-dev
          cmake -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=1 \
            -D USEARCH_USE_OPENMP=1 \
            -D USEARCH_ENABLE_ASAN=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build -j"$(nproc)"
      - name: ctest
        run: ctest --test-dir build --output-on-failure -L "unit|numkong" --timeout 1200

  # L3: GCC TSan+NumKong — concurrent nk_capabilities / metric init must be race-free.
  unit_numkong_tsan:
    name: GCC TSan NumKong
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          cmake -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_BENCH_CPP=0 \
            -D USEARCH_USE_NUMKONG=1 \
            -D USEARCH_ENABLE_TSAN=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build -j"$(nproc)"
      - name: ctest numkong
        run: ctest --test-dir build --output-on-failure -L numkong --timeout 1200

  fuzz_smoke:
    name: libFuzzer smoke
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build and fuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
          cmake -B build \
            -D USEARCH_BUILD_TEST_CPP=1 \
            -D USEARCH_BUILD_FUZZ=ON \
            -D USEARCH_SANITIZE_DEBUG=OFF
          cmake --build build --target fuzz_index fuzz_format fuzz_agentjson -j"$(nproc)"
          build/fuzz_index fuzz/corpus -max_total_time=60 -timeout=10
          build/fuzz_format -max_total_time=60 -timeout=10
          build/fuzz_agentjson -max_total_time=60 -timeout=10

  # PR 吞吐门禁：与 performance.yml 同地板；相对 cpp/perfhist.jsonl 末行防漂移
  perf_gate:
    name: Perf floor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init --recursive
      - name: Build Release test_perf
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          cmake -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D USEARCH_BUILD_TEST_CPP=ON \
            -D USEARCH_BUILD_BENCH_CPP=OFF \
            -D USEARCH_USE_NUMKONG=OFF
          cmake --build build --target test_perf -j"$(nproc)"
      - name: Floor + relative
        run: |
          set -euo pipefail
          ./build/test_perf | tee /tmp/perf.json
          python3 scripts/perfcheck.py \
            --perf /tmp/perf.json \
            --baseline cpp/baseline.json \
            --hist cpp/perfhist.jsonl \
            --svg /tmp/perftrend.svg \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --relative
          cat /tmp/perftrend.svg >> "$GITHUB_STEP_SUMMARY" || true
